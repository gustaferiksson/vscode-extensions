name: Release

# Tag a package to release it, e.g. `diff-files-v0.0.2` or `branch-pr-viewer-v0.1.0`.
on:
  push:
    tags:
      - "*-v*"

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag to be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main, refusing to release"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve package directory from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="${TAG%-v*}"
          if [ ! -d "packages/$DIR" ]; then
            echo "::error::Tag '$TAG' does not map to a packages/<dir> (looked for 'packages/$DIR')."
            exit 1
          fi
          echo "dir=packages/$DIR" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: bun run compile

      - name: Package & publish to VS Code Marketplace
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          bunx @vscode/vsce package --no-dependencies
          bunx @vscode/vsce publish --packagePath *.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PKG_DIR"/*.vsix \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_DIR: ${{ steps.pkg.outputs.dir }}
